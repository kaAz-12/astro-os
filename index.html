<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Astro OS UI v0.2</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef1f6;
  --panel:rgba(255,255,255,.75);
  --solid:#fff;
  --text:#171a22;
  --muted:#737987;
  --line:rgba(20,25,35,.09);
  --accent:#4d78df;
  --shadow:0 12px 35px rgba(35,45,70,.12);
}
:root.dark{
  color-scheme:dark;
  --bg:#0f1218;
  --panel:rgba(25,30,42,.78);
  --solid:#1d222e;
  --text:#f3f5fa;
  --muted:#9fa7b8;
  --line:rgba(255,255,255,.09);
  --accent:#8aa9ff;
  --shadow:0 12px 35px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
}

/* Status Bar Top */
.topbar{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-size:12px;
  font-weight:600;
  color:var(--text);
  backdrop-filter:blur(10px);
  z-index:10;
}
.status-right{display:flex;gap:10px;align-items:center}

/* Main Screen */
main{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:20px 20px 90px;
  overflow-y:auto;
}
.clock-widget{
  margin:10px 0 25px;
  text-align:left;
}
.clock{
  font-size:56px;
  font-weight:700;
  letter-spacing:-2px;
  line-height:1;
}
.date{
  font-size:15px;
  color:var(--muted);
  margin-top:6px;
  font-weight:500;
}

/* App Grid Mobile */
.apps-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px 12px;
  margin-top:15px;
}
.app-item{
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
  font:inherit;
  font-size:11px;
}
.icon-box{
  width:56px;
  height:56px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  transition:transform .1s;
}
.app-item:active .icon-box{transform:scale(0.92)}

/* Mobile Bottom Dock */
.dock-container{
  position:fixed;
  bottom:15px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  z-index:10;
  padding:0 20px;
}
.dock{
  display:flex;
  gap:16px;
  padding:10px 18px;
  border:1px solid var(--line);
  border-radius:24px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.dock .icon-box{
  width:48px;
  height:48px;
  border-radius:15px;
  font-size:22px;
  box-shadow:none;
}

/* Simple Control Overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(4px);
  z-index:20;
  display:none;
  align-items:flex-end;
}
.overlay.show{display:flex}
.sheet{
  width:100%;
  background:var(--solid);
  border-top-left-radius:25px;
  border-top-right-radius:25px;
  padding:20px;
  box-shadow:var(--shadow);
}
.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.close-btn{
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:50%;
  width:30px;
  height:30px;
  font-size:16px;
  cursor:pointer;
}

/* Gaya untuk Kalkulator */
.calc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 15px;
}
.calc-screen {
  width: 100%;
  height: 55px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  font-size: 24px;
  font-weight: 600;
  text-align: right;
  padding: 0 15px;
  color: var(--text);
  margin-bottom: 10px;
}
.calc-btn {
  padding: 15px;
  font-size: 18px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}
.calc-btn:active {
  background: var(--accent);
  color: white;
}
.calc-btn.op {
  color: var(--accent);
}
</style>
</head>
<body>

<header class="topbar">
  <div id="statusClock">00:00</div>
  <div class="status-right">
    <span id="statusBattery">⚡ --%</span>
  </div>
</header>

<main>
  <div class="clock-widget">
    <div class="clock" id="mainClock">00:00</div>
    <div class="date" id="mainDate">Memuat tanggal...</div>
  </div>

  <div class="apps-grid" id="appsGrid"></div>
</main>

<div class="dock-container">
  <div class="dock" id="dockGrid"></div>
</div>

<div class="overlay" id="appModal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="modalTitle" style="margin:0">Aplikasi</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <p id="modalDesc" style="color:var(--muted);font-size:14px">Detail aplikasi Astra OS.</p>
  </div>
</div>

<script>
// Data Aplikasi
const apps = [
  ['⚙️', 'Pengaturan', 'Pengaturan sistem Astra OS.'],
  ['🗂️', 'Berkas', 'Manajer file lokal.'],
  ['🖼️', 'Galeri', 'Koleksi foto dan gambar.'],
  ['🎵', 'Musik', 'Pemutar musik digital.'],
  ['🧮', 'Kalkulator', 'Kalkulator bawaan.'],
  ['📝', 'Catatan', 'Catatan cepat.'],
  ['📅', 'Kalender', 'Jadwal dan agenda.'],
  ['🌐', 'Browser', 'Peramban web.']
];

// Render Apps ke Layar Utama & Dock
const appsGrid = document.getElementById('appsGrid');
const dockGrid = document.getElementById('dockGrid');

apps.forEach(app => {
  const btn = document.createElement('button');
  btn.className = 'app-item';
  btn.onclick = () => openModal(app[1], app[2]);
  btn.innerHTML = `<div class="icon-box">${app[0]}</div><span>${app[1]}</span>`;
  appsGrid.appendChild(btn);
});

apps.slice(0, 4).forEach(app => {
  const btn = document.createElement('button');
  btn.className = 'app-item';
  btn.onclick = () => openModal(app[1], app[2]);
  btn.innerHTML = `<div class="icon-box">${app[0]}</div>`;
  dockGrid.appendChild(btn);
});

// --- FUNGSI UTAMA: openModal (Menangani Kalkulator & Aplikasi Lain) ---
function openModal(name, desc) {
  document.getElementById('modalTitle').textContent = name;
  const modalDesc = document.getElementById('modalDesc');
  
  // Kalau yang diklik Kalkulator, munculkan tombol kalkulator
  if (name === 'Kalkulator') {
    modalDesc.innerHTML = `
      <input type="text" class="calc-screen" id="calcScreen" value="0" readonly>
      <div class="calc-grid">
        <button class="calc-btn" onclick="calcClear()">C</button>
        <button class="calc-btn" onclick="calcAppend('(')">(</button>
        <button class="calc-btn" onclick="calcAppend(')')">)</button>
        <button class="calc-btn op" onclick="calcAppend('/')">÷</button>
        
        <button class="calc-btn" onclick="calcAppend('7')">7</button>
        <button class="calc-btn" onclick="calcAppend('8')">8</button>
        <button class="calc-btn" onclick="calcAppend('9')">9</button>
        <button class="calc-btn op" onclick="calcAppend('*')">×</button>
        
        <button class="calc-btn" onclick="calcAppend('4')">4</button>
        <button class="calc-btn" onclick="calcAppend('5')">5</button>
        <button class="calc-btn" onclick="calcAppend('6')">6</button>
        <button class="calc-btn op" onclick="calcAppend('-')">-</button>
        
        <button class="calc-btn" onclick="calcAppend('1')">1</button>
        <button class="calc-btn" onclick="calcAppend('2')">2</button>
        <button class="calc-btn" onclick="calcAppend('3')">3</button>
        <button class="calc-btn op" onclick="calcAppend('+')">+</button>
        
        <button class="calc-btn" onclick="calcAppend('0')" style="grid-column: span 2">0</button>
        <button class="calc-btn" onclick="calcAppend('.')">.</button>
        <button class="calc-btn op" onclick="calcCalculate()">=</button>
      </div>
    `;
  } else {
    // Kalau aplikasi lain (Galeri, Musik, dll), tetap tampilkan teks deskripsinya
    modalDesc.textContent = desc;
  }
  
  // Munculkan kotaknya (modal)
  document.getElementById('appModal').classList.add('show');
}

function closeModal() {
  document.getElementById('appModal').classList.remove('show');
}

// --- OTAK KALKULATOR ---
let calcExpression = "0";

function calcAppend(val) {
  const screen = document.getElementById('calcScreen');
  if (calcExpression === "0" && val !== '.') {
    calcExpression = val;
  } else {
    calcExpression += val;
  }
  screen.value = calcExpression;
}

function calcClear() {
  calcExpression = "0";
  document.getElementById('calcScreen').value = calcExpression;
}

function calcCalculate() {
  const screen = document.getElementById('calcScreen');
  try {
    let result = eval(calcExpression.replace('×', '*').replace('÷', '/'));
    screen.value = result;
    calcExpression = result.toString();
  } catch (error) {
    screen.value = "Error";
    calcExpression = "0";
  }
}

// Update Waktu & Tanggal Berdasarkan Lokasi Perangkat
function updateDateTime() {
  const now = new Date();
  
  // Waktu
  const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('mainClock').textContent = timeStr;
  document.getElementById('statusClock').textContent = timeStr;
  
  // Tanggal
  const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('mainDate').textContent = now.toLocaleDateString('id-ID', dateOptions);
}
updateDateTime();
setInterval(updateDateTime, 1000);

// Status Baterai Real-time (Battery Status API)
function initBattery() {
  if ('getBattery' in navigator) {
    navigator.getBattery().then(battery => {
      function updateBattery() {
        const level = Math.round(battery.level * 100);
        const charging = battery.charging ? '⚡ ' : '';
        document.getElementById('statusBattery').textContent = `${charging}${level}%`;
      }
      updateBattery();
      battery.addEventListener('levelchange', updateBattery);
      battery.addEventListener('chargingchange', updateBattery);
    });
  } else {
    document.getElementById('statusBattery').textContent = '🔋 100%';
  }
}
initBattery();
</script>
</body>
</html>
